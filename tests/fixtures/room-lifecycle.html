<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>书房生命周期验收（仅开发服务器）</title>
  <style>
    body {
      margin: 0;
      background: #182822;
      color: white;
      font: 14px sans-serif;
    }
    button {
      min-height: 44px;
      margin: 8px;
      padding: 0 16px;
    }
    iframe {
      width: 100%;
      height: 650px;
      border: 0;
    }
    pre {
      padding: 12px;
      white-space: pre-wrap;
    }
  </style>
  <nav>
    <button data-mode="normal">正常书房</button
    ><button data-mode="unsupported">无 WebGL</button
    ><button data-mode="missing">素材失败</button
    ><button data-mode="reduced">减少动态效果</button
    ><button id="check">检查暂停、后台和恢复</button>
  </nav>
  <pre>载入中</pre>
  <iframe title="实际书房"></iframe>
  <script type="module">
    const iframe = document.querySelector('iframe'),
      output = document.querySelector('pre');
    const source = await (await fetch('/room/')).text();
    function boot(mode) {
      const bootstrap = `<script>
 window.__draws=0;
 const nativeDraw=WebGL2RenderingContext.prototype.drawElements;
 WebGL2RenderingContext.prototype.drawElements=function(...args){window.__draws++;return nativeDraw.apply(this,args)};
 if('${mode}'==='unsupported'){
  const original=HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext=function(type,...rest){return type==='webgl'||type==='webgl2'?null:original.call(this,type,...rest)};
 }
 if('${mode}'==='missing'){
  const originalFetch=window.fetch.bind(window); window.fetch=(url,...rest)=>String(url).includes('girl.vrm')?Promise.resolve(new Response('',{status:404})):originalFetch(url,...rest);
 }
 if('${mode}'==='reduced'){
  const original=window.matchMedia.bind(window);
  window.matchMedia=(query)=>{const result=original(query);return query==='(prefers-reduced-motion: reduce)'?new Proxy(result,{get(target,key){if(key==='matches')return true;const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value}}):result};
 }
 <\/script>`;
      iframe.srcdoc = source.replace(
        '<head>',
        '<head><base href="' + location.origin + '/">' + bootstrap,
      );
      output.textContent = '模式：' + mode;
      iframe.onload = () =>
        setTimeout(() => {
          const d = iframe.contentDocument;
          output.textContent = JSON.stringify(
            {
              mode,
              state: d.querySelector('[data-room]')?.dataset.roomReady,
              canvasHidden: d.querySelector('canvas')?.hidden,
              button: d.querySelector('[data-room-motion]')?.textContent,
              disabled: d.querySelector('[data-room-motion]')?.disabled,
              status: d.querySelector('[data-room-status]')?.textContent,
              links: d.querySelectorAll('.room-links a').length,
              draws: iframe.contentWindow.__draws,
            },
            null,
            2,
          );
        }, 7000);
    }
    for (const button of document.querySelectorAll('[data-mode]'))
      button.onclick = () => boot(button.dataset.mode);
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    document.querySelector('#check').onclick = async () => {
      const w = iframe.contentWindow,
        d = iframe.contentDocument,
        button = d.querySelector('[data-room-motion]');
      const samples = {};
      if (button.getAttribute('aria-pressed') === 'true') button.click();
      const coal = d.querySelector('[data-coal-root]'),
        toggle = d.querySelector('[data-coal-toggle]');
      const position = () => coal.style.left + ',' + coal.style.top;
      for (const mode of ['focus', 'pointerenter', 'pointerdown']) {
        if (mode === 'focus') toggle.focus();
        else
          toggle.dispatchEvent(
            new w.PointerEvent(mode, {
              bubbles: true,
              pointerType: mode === 'pointerdown' ? 'touch' : 'mouse',
            }),
          );
        const before = position();
        await wait(1100);
        samples[mode] = position() === before;
        if (mode === 'focus') toggle.blur();
        else
          w.dispatchEvent(
            new w.PointerEvent('pointercancel', { bubbles: true }),
          );
        toggle.dispatchEvent(
          new w.PointerEvent('pointerleave', { bubbles: true }),
        );
      }
      let n = w.__draws;
      await wait(1100);
      samples.running = w.__draws - n;
      button.click();
      n = w.__draws;
      await wait(1100);
      samples.paused = w.__draws - n;
      button.click();
      Object.defineProperty(d, 'hidden', { configurable: true, value: true });
      d.dispatchEvent(new w.Event('visibilitychange'));
      n = w.__draws;
      await wait(1100);
      samples.background = w.__draws - n;
      Object.defineProperty(d, 'hidden', { configurable: true, value: false });
      d.dispatchEvent(new w.Event('visibilitychange'));
      n = w.__draws;
      await wait(1100);
      samples.resumed = w.__draws - n;
      w.dispatchEvent(
        new w.PageTransitionEvent('pagehide', { persisted: true }),
      );
      n = w.__draws;
      await wait(250);
      samples.pagehide = w.__draws - n;
      w.dispatchEvent(
        new w.PageTransitionEvent('pageshow', { persisted: true }),
      );
      await wait(7000);
      samples.restored =
        d.querySelector('[data-room]').dataset.roomReady === 'true' &&
        !d.querySelector('canvas').hidden;
      const gl = d.querySelector('canvas').getContext('webgl2'),
        lose = gl.getExtension('WEBGL_lose_context');
      lose.loseContext();
      await wait(100);
      samples.contextLost = d.querySelector('canvas').hidden;
      lose.restoreContext();
      await wait(1000);
      samples.contextRestored = !d.querySelector('canvas').hidden;
      samples.passed =
        samples.focus &&
        samples.pointerenter &&
        samples.pointerdown &&
        samples.running > 0 &&
        samples.paused === 0 &&
        samples.background === 0 &&
        samples.resumed > 0 &&
        samples.pagehide === 0 &&
        samples.restored &&
        samples.contextLost &&
        samples.contextRestored;
      output.textContent = JSON.stringify(samples, null, 2);
    };
    boot('normal');
  </script>
</html>
