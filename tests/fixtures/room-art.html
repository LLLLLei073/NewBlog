<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>书房画面验收</title>
  <style>
    body {
      margin: 0;
      background: #172420;
      color: #ece8dc;
      font: 14px sans-serif;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      padding: 8px;
      gap: 8px;
    }
    button,
    select {
      min-height: 40px;
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 3/2;
    }
    pre {
      padding: 8px;
      white-space: pre-wrap;
    }
  </style>
  <nav>
    <button data-minute="420">清晨</button
    ><button data-minute="720">正午</button
    ><button data-minute="1080">黄昏</button
    ><button data-minute="0">午夜</button
    ><select aria-label="台灯">
      <option value="auto">跟随时间</option>
      <option value="on">开</option>
      <option value="off">关</option></select
    ><button data-time="0">阅读</button><button data-time="27">起身</button
    ><button data-time="30">行走</button><button data-time="40">窗边</button
    ><button id="shelf">书架</button><button id="run">连续三个循环</button>
  </nav>
  <pre>载入中</pre>
  <canvas></canvas>
  <script type="module">
    import { createIllustratedRoom } from '/src/components/room/illustrated-scene.ts';
    import {
      activityCycle,
      cycleDuration,
      girlAt,
    } from '/src/components/room/activity.ts';
    const canvas = document.querySelector('canvas'),
      output = document.querySelector('pre');
    const scene = await createIllustratedRoom(
      canvas,
      new AbortController().signal,
    );
    let minutes = 720,
      time = 0,
      lamp = 'auto',
      cycle = activityCycle('window', 26),
      running = false,
      last = 0,
      count = 0;
    function draw() {
      const girl = girlAt(cycle, time);
      scene.draw(minutes, lamp, girl);
      output.textContent = JSON.stringify({
        minutes,
        lamp,
        time: time.toFixed(2),
        pose: girl.pose,
        frame: girl.frame,
        position: [girl.x, girl.y],
        completedCycles: count,
      });
    }
    for (const b of document.querySelectorAll('[data-minute]'))
      b.onclick = () => {
        minutes = Number(b.dataset.minute);
        draw();
      };
    for (const b of document.querySelectorAll('[data-time]'))
      b.onclick = () => {
        running = false;
        cycle = activityCycle('window', 26);
        time = Number(b.dataset.time);
        draw();
      };
    document.querySelector('select').onchange = (e) => {
      lamp = e.target.value;
      draw();
    };
    document.querySelector('#shelf').onclick = () => {
      running = false;
      cycle = activityCycle('shelf', 26);
      time = 42;
      draw();
    };
    document.querySelector('#run').onclick = () => {
      running = true;
      time = 0;
      count = 0;
      last = 0;
      cycle = activityCycle('window', 26);
      requestAnimationFrame(animate);
    };
    function animate(now) {
      if (!running) return;
      if (!last || now - last >= 1000 / 30) {
        time += last ? Math.min((now - last) / 1000, 0.1) * 3 : 0;
        last = now;
        if (time >= cycleDuration(cycle)) {
          time -= cycleDuration(cycle);
          count++;
          cycle = activityCycle(count % 2 ? 'shelf' : 'window', 26);
          if (count === 3) {
            running = false;
            time = 0;
          }
        }
        draw();
      }
      if (running) requestAnimationFrame(animate);
    }
    new ResizeObserver(draw).observe(canvas);
    draw();
  </script>
</html>
